<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | Infinite Journey</title>
  <link rel="stylesheet" href="thankyou.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  <style>
    /* Base Styles */
body {
  margin: 0;
  font-family: "Poppins", sans-serif;
  background-color: #eff3f8;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.thankyou-container {
  display: grid;
  grid-template-columns: 1fr 2fr;
  background-color: white;
  color: #001f3f;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  max-width: 1000px;
  width: 90%;
}

/* Left Side - Logo */
.logo-section {
  background-color: #001f3f;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 40px;
}
.logo-section img {
  max-width: 200px;
  width: 100%;
}

/* Right Side - Content */
.content-section {
  padding: 40px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.thankyou-box {
  text-align: center;
}

.thankyou-box h1 {
  font-size: 1.8rem;
  margin-bottom: 30px;
}

.thankyou-box h1 span {
  color: #2ecc71; /* green color for "Thank you" */
}

/* Directors Section */
.directors h2 {
  font-size: 1.3rem;
  margin-bottom: 15px;
  color: #1e90ff;
}

.director-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
  margin-bottom: 30px;
}

.director {
  background-color: #f3f8ff;
  padding: 15px;
  border-radius: 10px;
  color: #001f3f;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.director h3 {
  margin: 0 0 5px;
  color: #001f3f;
}

/* Office Timing */
.office-timing h2 {
  font-size: 1.3rem;
  color: #1e90ff;
  margin-bottom: 10px;
}

/* Button */
.home-btn {
  display: inline-block;
  margin-top: 25px;
  padding: 12px 25px;
  background-color: #1e90ff;
  color: white;
  border-radius: 25px;
  text-decoration: none;
  transition: all 0.3s ease;
  font-weight: 500;
}

.home-btn:hover {
  background-color: #2ecc71;
  transform: scale(1.05);
}

/* =================== RESPONSIVE =================== */

/* Tablet */
@media (max-width: 900px) {
  .thankyou-container {
    grid-template-columns: 1fr;
  }

  .logo-section {
    padding: 20px;
  }

  .content-section {
    padding: 30px 20px;
  }

  .director-grid {
    grid-template-columns: 1fr;
  }
}

/* Mobile */
@media (max-width: 480px) {
  .thankyou-box h1 {
    font-size: 1.4rem;
  }

  .logo-section img {
    max-width: 150px;
  }

  .home-btn {
    font-size: 0.9rem;
    padding: 10px 20px;
  }

  .director-grid {
    gap: 10px;
  }

  .director {
    padding: 10px;
  }
}

  </style>
</head>
<body>
  <div class="thankyou-container">
    <!-- Left side: Logo -->
    <div class="logo-section">
      <img src="infinite logo white.png" alt="Infinite Journey Logo" />
    </div>

    <!-- Right side: Content -->
    <div class="content-section">
      <div class="thankyou-box">
        <h1>✅ <span>Thank you</span> for submitting the form!</h1>
        <p>WE WILL CONTACT YOU AS SOON AS POSSIBLE,THANKS</p>
        
        <div class="directors">
          <h2>Company Directors</h2>
          <div class="director-grid">
            <div class="director">
              <h3>Rana Touseef Ahmad</h3>
            </div>
            <div class="director">
              <h3>Mr. Awais Ahmad</h3>
            </div>
          </div>
        </div>

        <div class="office-timing">
          <h2>Office Timings</h2>
          <p>Monday - Saturday: 10:00 AM - 7:00 PM</p>
          <p>Sunday: Closed</p>
        </div>

        <a href="index.html" class="home-btn">← Go Back to Home Page</a>
      </div>
    </div>
  </div>
</body>
</html>
